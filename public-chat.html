<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Простой Чат</title>
    <script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 400px;
            height: 600px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: #2E7D32;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        .login-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex: 1;
            padding: 40px;
        }

        .login-screen input {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 20px;
            outline: none;
        }

        .login-screen input:focus {
            border-color: #2E7D32;
        }

        .login-screen button {
            width: 100%;
            padding: 15px;
            background: #2E7D32;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .login-screen button:hover {
            background: #1976D2;
        }

        .chat-screen {
            display: none;
            flex-direction: column;
            flex: 1;
        }

        .status {
            padding: 10px;
            background: #4CAF50;
            color: white;
            text-align: center;
            font-size: 14px;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            margin-bottom: 15px;
            max-width: 80%;
        }

        .message.own {
            margin-left: auto;
            background: #2E7D32;
            color: white;
            border-radius: 15px 15px 5px 15px;
        }

        .message.other {
            background: #f1f1f1;
            border-radius: 15px 15px 15px 5px;
        }

        .message-content {
            padding: 10px 15px;
        }

        .message-header {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 5px;
        }

        .input-area {
            padding: 20px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
        }

        .input-area button {
            padding: 12px 20px;
            background: #2E7D32;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="chat-container">
        <div class="header">Простой Чат</div>

        <div class="login-screen" id="loginScreen">
            <input type="text" id="usernameInput" placeholder="Введите ваше имя" maxlength="20">
            <button onclick="joinChat()">Войти в чат</button>
        </div>

        <div class="chat-screen" id="chatScreen">
            <div class="status" id="status">Подключение...</div>
            <div class="messages" id="messages"></div>
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="Введите сообщение..."
                    onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <script>
        let socket;
        let username;
        let isConnected = false;

        // URL сервера - используем новую serveo ссылку
        const SERVER_URL = 'https://c8cb7d74ab2ab37a50e46d2bb3ba00a4.serveo.net';

        function joinChat() {
            const usernameInput = document.getElementById('usernameInput');
            username = usernameInput.value.trim();

            if (!username) {
                alert('Пожалуйста, введите ваше имя');
                return;
            }

            // Скрываем экран входа и показываем чат
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('chatScreen').style.display = 'flex';

            // Подключаемся к серверу
            connectToServer();
        }

        function connectToServer() {
            console.log('Подключение к:', SERVER_URL);
            socket = io(SERVER_URL);

            socket.on('connect', () => {
                console.log('Подключен к серверу');
                isConnected = true;
                updateStatus('🟢 Подключен к чату', '#4CAF50');
                socket.emit('userJoin', username);
            });

            socket.on('disconnect', () => {
                console.log('Отключен от сервера');
                isConnected = false;
                updateStatus('🔴 Подключение потеряно', '#F44336');
            });

            socket.on('messageHistory', (history) => {
                console.log('Получена история:', history.length);
                const messagesDiv = document.getElementById('messages');
                messagesDiv.innerHTML = '';
                history.forEach(msg => addMessage(msg));
            });

            socket.on('newMessage', (message) => {
                console.log('Новое сообщение:', message);
                addMessage(message);
            });

            socket.on('userJoined', (data) => {
                updateStatus(`🟢 Онлайн: ${data.users.length}`, '#4CAF50');
            });

            socket.on('userLeft', (data) => {
                updateStatus(`🟢 Онлайн: ${data.users.length}`, '#4CAF50');
            });

            socket.on('joinSuccess', (data) => {
                updateStatus(`🟢 Онлайн: ${data.users.length}`, '#4CAF50');
            });

            socket.on('error', (error) => {
                console.error('Ошибка:', error);
                updateStatus('❌ Ошибка подключения', '#F44336');
            });
        }

        function updateStatus(text, color) {
            const status = document.getElementById('status');
            status.textContent = text;
            status.style.backgroundColor = color;
        }

        function addMessage(message) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${message.username === username ? 'own' : 'other'}`;

            const time = new Date(message.timestamp).toLocaleTimeString('ru-RU', {
                hour: '2-digit',
                minute: '2-digit'
            });

            messageDiv.innerHTML = `
                <div class="message-content">
                    <div class="message-header">${message.username} • ${time}</div>
                    <div>${message.text}</div>
                </div>
            `;

            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const text = messageInput.value.trim();

            if (!text || !isConnected) return;

            socket.emit('sendMessage', {
                text: text,
                username: username,
                timestamp: new Date().toISOString()
            });

            messageInput.value = '';
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // Автофокус на поле ввода имени
        document.getElementById('usernameInput').focus();
    </script>
</body>

</html>
